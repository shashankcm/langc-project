[project]
name = "langc-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.1",
